name: flink-disk-job
namespace: stream
jobName: flink-disk-job

image:
  repository: k3d-flink:12345/flink-disk-job
  tag: dev
  pullPolicy: IfNotPresent

serviceAccount: flink

job:
#  flinkVersion: v2_1
  flinkVersion: v1_20
  jarURI: local:///opt/flink/usrlib/flink-job.jar
  state: running
  parallelism: 2
  upgradeMode: stateless
  restartNonce: 0
  recordsPerSecond: 1

jobManager:
  cpu: 0.5
  memorySize: 1g

taskManager:
  replicas: 1
  numberOfTaskSlots: 2
  cpu: 0.5
  memorySize: 1600m

diskAutoscaler:
  enabled: true
  # Prometheus-compatible endpoint serving kubelet_volume_stats_* (mock in dev)
  metricsEndpoint: http://mock-prometheus.monitoring.svc.cluster.local:9090
  # Regex on the persistentvolumeclaim label selecting this job's TM volumes
  pvcNamePattern: flink-disk-job-taskmanager-.*
  # Short intervals for a fast local test loop (defaults: 5m / 15m)
  stabilizationInterval: 30s
  metricsWindow: 1m

localStorage:
  enabled: true
  volumeName: local-storage
  mountPath: /opt/flink/local-storage
  storageClassName: local-path
  size: 1Gi

checkpointing:
  enabled: false
  interval: 60 s
  minPause: 50 s
  timeout: 10 min

highAvailability:
  enabled: false
  storageDir: ""

s3:
  enabled: false
  endpoint: ""
  accessKey: ""
  secretKey: ""

state:
  checkpointsDir: ""
  savepointsDir: ""
